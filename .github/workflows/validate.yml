name: Validate source
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install developer test dependencies with explicit consent
        shell: pwsh
        run: ./setup.ps1 -PythonExe (Get-Command python).Source -DownloadDependencies
      - name: Audit tracked source and Python syntax
        run: ./.venv/Scripts/python.exe scripts/audit_release.py
      - name: Offline tests (no account or model calls)
        run: ./.venv/Scripts/python.exe -m unittest discover -s tests/unit -t .
      - name: PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem *.ps1 | ForEach-Object {
            $syntaxErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$syntaxErrors) | Out-Null
            if ($syntaxErrors) { throw $syntaxErrors }
          }
# The full offline runtime/ZIP is a separate maintainer build. Do not download
# native executables or access a Houdini/AI account during source validation.
